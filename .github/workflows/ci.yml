name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (runtime deps only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Runtime requirements ONLY -- no scikit-learn, xgboost or pandas.
      # If a test ever needs the training stack to pass, that is a signal the
      # test is not exercising the artifact the Docker image actually ships.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4 httpx==0.28.1

      - name: Confirm the training stack is absent
        run: |
          ! pip show scikit-learn xgboost pandas > /dev/null 2>&1 \
            || (echo "Training libraries leaked into the runtime set" && exit 1)

      # The dataset is gitignored and never reaches CI; tests run entirely
      # against the committed ONNX model and its parity fixture.
      - name: Verify committed model artifacts
        run: |
          test -f models/fraud_model.onnx
          test -f models/metadata.json
          test -f models/parity_fixture.json

      - name: Run tests
        run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The `test` stage derives FROM the same layers the runtime image ships,
      # adding only pytest and the test files. This is where the linux/amd64
      # artifact gets exercised -- it is never built on an arm64 laptop, so CI
      # is the only place it can be tested before it reaches AWS. A failing
      # test fails the build here.
      - name: Test inside the built image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: fraud-api:ci
          cache-from: type=gha

      - name: Runtime image must not contain the training stack
        run: |
          docker run --rm fraud-api:ci pip list > packages.txt
          cat packages.txt
          if grep -Eiq 'scikit-learn|xgboost|pandas|skl2onnx|onnxmltools' packages.txt; then
            echo "::error::Training libraries leaked into the runtime image"
            exit 1
          fi
          echo "Confirmed: no training stack in the runtime image"

      - name: Report image size
        run: |
          SIZE_MB=$(docker image inspect fraud-api:ci --format '{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')
          echo "Runtime image: ${SIZE_MB} MB"
          echo "### Runtime image: ${SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          # Generous ceiling -- this is a regression guard against the training
          # stack or another heavyweight dependency creeping back in, not a
          # tight budget. The measured size is ~382MB.
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::Image grew to ${SIZE_MB}MB (ceiling 500MB)"
            exit 1
          fi

      - name: Container serves predictions
        run: |
          docker run -d --name api -p 8000:8000 fraud-api:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:8000/ready
          docker rm -f api
