# CodeDeploy AppSpec for ECS blue/green.
#
# <TASK_DEFINITION> is a placeholder, not a value. The deploy workflow registers
# a new task-definition revision with the freshly built image, and
# aws-actions/amazon-ecs-deploy-task-definition substitutes its ARN here before
# calling CreateDeployment. Committing a real ARN would pin every deployment to
# one revision.
#
# ContainerName and ContainerPort must match the container in the task
# definition and the target groups' port -- that pairing is how CodeDeploy knows
# what to register into the replacement target group. A mismatch here is one of
# the two classic causes of a deployment that hangs at "Install" and eventually
# times out with nothing useful in the event log. (The other is a target group
# with target_type "instance" instead of "ip".) Both are pinned in Terraform:
# var.container_name and var.container_port.
version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: "<TASK_DEFINITION>"
        LoadBalancerInfo:
          ContainerName: "fraud-api"
          ContainerPort: 8000
        # Matches aws_ecs_service.app.platform_version. Left implicit, the
        # replacement task set can land on a different platform version from
        # the one the VPC endpoint set was chosen for.
        PlatformVersion: "1.4.0"
